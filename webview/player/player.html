<!doctype html>
<html lang="en">
  <head>
    <title>Player</title>
    <meta charset="UTF-8" />
    <!-- <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; media-src {{ cspSource }} https:; img-src {{ cspSource }} https:; script-src 'nonce-{{ nonce }}'; style-src {{ cspSource }} 'unsafe-inline'; font-src  {{ cspSource }} ;"
    /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="player.css" rel="stylesheet" />
  </head>
  <body>
    <div class="media-container {{ background }}">
      <!-- Video Player -->
      <div {{ videoHideState }} id="video-media-player" class="media-player">
        <video
          {{
          autoplay
          }}
          {{
          loop
          }}
          id="video-preview"
          src="{{ videoDir }}"
          tabindex="0"
        ></video>
      </div>
      <!-- Image Player -->
      <div {{ imageHideState }} id="image-media-player" class="media-player">
        <img src="{{ imageDir }}" id="image-preview" />
      </div>

      <!-- Audio Track (background audio) - hidden, synced with muted video -->
      <audio
        {{
        audioHideState
        }}
        id="audio-track"
        preload="auto"
        {{
        audioSrcAttr
        }}
        {{
        audioLoop
        }}
      ></audio>

      <!-- ==== NEW CONTROL BAR ==== -->
      <div class="controls-container">
        <!-- Progress Bar -->
        <div class="progress-bar {{ previewShowProgressOnIdle }}">
          <div class="progress-bar-background"></div>
          <div class="demo-fill"></div>
          <div class="color-fill" {{ previewProgressStyle }}></div>
        </div>

        <!-- Bottom Controls Row -->
        <div class="controls">
          <div class="controls-left">
            <button
              class="control-button"
              id="play-pause-button"
              title="Play/Pause (Space)"
            >
              <svg
                id="play-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 32 32"
              >
                <path
                  fill="currentColor"
                  d="M7 28a1 1 0 0 1-1-1V5a1 1 0 0 1 1.482-.876l20 11a1 1 0 0 1 0 1.752l-20 11A1 1 0 0 1 7 28"
                />
              </svg>
              <svg
                id="pause-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 32 32"
                style="display: none"
              >
                <path
                  fill="currentColor"
                  d="M12 28a1 1 0 0 1-1-1V5a1 1 0 0 1 2 0v22a1 1 0 0 1-1 1m8 0a1 1 0 0 1-1-1V5a1 1 0 0 1 2 0v22a1 1 0 0 1-1 1"
                />
              </svg>
            </button>
            <div class="volume-container {{ volumeVisibility }}">
              <button
                class="control-button"
                id="volume-button"
                title="Mute (M)"
              >
                <svg
                  id="volume-high-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                >
                  <path
                    d="M8.69398 2.03934C8.8792 2.11749 8.99961 2.29898 8.99961 2.50001V13.5C8.99961 13.7014 8.87875 13.8832 8.693 13.9611C8.50725 14.039 8.29289 13.9978 8.14921 13.8567L5.22278 10.9817H3.49963C2.67121 10.9817 1.99963 10.3101 1.99963 9.48172V6.49273C1.99963 5.66431 2.67121 4.99273 3.49963 4.99273H5.22402L8.15073 2.14185C8.29474 2.00157 8.50875 1.96119 8.69398 2.03934ZM7.99961 3.68507L5.77617 5.85089C5.68281 5.94184 5.55763 5.99273 5.42729 5.99273H3.49963C3.22349 5.99273 2.99963 6.21659 2.99963 6.49273V9.48172C2.99963 9.75786 3.22349 9.98172 3.49963 9.98172H5.42729C5.55836 9.98172 5.68419 10.0332 5.77769 10.125L7.99961 12.3079V3.68507ZM10.1109 5.18874C10.2828 4.97264 10.5973 4.93682 10.8135 5.10873L10.8143 5.1094L10.8152 5.11015L10.8174 5.11188L10.8228 5.11628L10.8377 5.12882C10.8495 5.13885 10.8648 5.15224 10.8831 5.16904C10.9197 5.20261 10.9685 5.2499 11.0254 5.31119C11.1389 5.43362 11.2853 5.61296 11.4303 5.85143C11.7218 6.33096 12.0039 7.04439 12.0039 7.99855C12.0039 8.95268 11.7218 9.66687 11.4305 10.1471C11.2857 10.3859 11.1393 10.5657 11.0259 10.6884C10.9692 10.7498 10.9204 10.7973 10.8839 10.8309C10.8642 10.849 10.8441 10.8666 10.8236 10.8838L10.8152 10.8907L10.8143 10.8914C10.8143 10.8914 10.368 11.1337 10.1116 10.8129C9.94006 10.5983 9.97396 10.2858 10.1868 10.1128L10.1883 10.1115L10.1876 10.1122L10.1892 10.1108L10.1883 10.1115C10.1912 10.109 10.1975 10.1036 10.2066 10.0952C10.2248 10.0784 10.2543 10.05 10.2914 10.0098C10.3659 9.92923 10.47 9.80248 10.5755 9.62847C10.7851 9.28301 11.0039 8.74609 11.0039 7.99855C11.0039 7.25106 10.7851 6.71522 10.5758 6.3709C10.4703 6.19744 10.3663 6.07121 10.292 5.99105C10.2549 5.95104 10.2255 5.92278 10.2073 5.90613C10.1982 5.89781 10.192 5.89242 10.1891 5.88995L10.1901 5.89071C9.97439 5.71873 9.93908 5.40472 10.1109 5.18874ZM11.8127 3.10886C11.5966 2.93686 11.2821 2.97255 11.1101 3.18858C10.9382 3.40451 10.9743 3.71932 11.19 3.89138L11.2011 3.9006C11.2119 3.90975 11.2295 3.92484 11.2528 3.94582C11.2994 3.98781 11.369 4.05318 11.4538 4.14133C11.6239 4.31792 11.8537 4.58411 12.0841 4.93509C12.5446 5.63643 13.0029 6.66847 13.0029 8.00405C13.0029 9.33953 12.5446 10.3694 12.0845 11.0685C11.8541 11.4184 11.6244 11.6835 11.4545 11.8593C11.3697 11.947 11.3002 12.0121 11.2536 12.0538C11.2303 12.0747 11.2128 12.0897 11.202 12.0988L11.1904 12.1083L11.1895 12.1091C10.9742 12.2808 10.9382 12.5945 11.1093 12.8105C11.2808 13.0269 11.596 13.0628 11.8125 12.8913L11.8455 12.8642C11.864 12.8487 11.8895 12.8268 11.9209 12.7986C11.9838 12.7423 12.0707 12.6607 12.1735 12.5543C12.3789 12.3418 12.6496 12.0286 12.9197 11.6183C13.4604 10.797 14.0029 9.57884 14.0029 8.00405C14.0029 6.42934 13.4605 5.20938 12.9201 4.38627C12.6501 3.97503 12.3795 3.66089 12.1742 3.4477C12.0714 3.34097 11.9846 3.25908 11.9217 3.20255C11.8903 3.17426 11.8649 3.15228 11.8464 3.13665L11.8239 3.11798L11.8169 3.11222L11.8144 3.11024L11.8127 3.10886ZM10.1891 5.88995L10.1877 5.88874L10.1891 5.88995Z"
                  />
                </svg>

                <svg
                  id="volume-muted-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  style="display: none"
                >
                  <path
                    d="M8.69386 2.03934C8.87908 2.11749 8.99949 2.29898 8.99949 2.50001V13.5C8.99949 13.7014 8.87862 13.8832 8.69288 13.9611C8.50713 14.039 8.29277 13.9978 8.14909 13.8567L5.22265 10.9817H3.49951C2.67108 10.9817 1.99951 10.3101 1.99951 9.48172V6.49273C1.99951 5.66431 2.67108 4.99273 3.49951 4.99273H5.22389L8.15061 2.14185C8.29461 2.00157 8.50863 1.96119 8.69386 2.03934ZM7.99949 3.68507L5.77605 5.85089C5.68269 5.94184 5.5575 5.99273 5.42717 5.99273H3.49951C3.22337 5.99273 2.99951 6.21659 2.99951 6.49273V9.48172C2.99951 9.75786 3.22337 9.98172 3.49951 9.98172H5.42717C5.55824 9.98172 5.68407 10.0332 5.77757 10.125L7.99949 12.3079V3.68507ZM10.1464 6.14646C10.3417 5.9512 10.6583 5.9512 10.8536 6.14646L12 7.29291L13.1464 6.14646C13.3417 5.9512 13.6583 5.9512 13.8536 6.14646C14.0488 6.34172 14.0488 6.65831 13.8536 6.85357L12.7071 8.00001L13.8536 9.14646C14.0488 9.34172 14.0488 9.65831 13.8536 9.85357C13.6583 10.0488 13.3417 10.0488 13.1464 9.85357L12 8.70712L10.8536 9.85357C10.6583 10.0488 10.3417 10.0488 10.1464 9.85357C9.95118 9.65831 9.95118 9.34172 10.1464 9.14646L11.2929 8.00001L10.1464 6.85357C9.95118 6.65831 9.95118 6.34172 10.1464 6.14646Z"
                  />
                </svg>
              </button>
              <input
                type="range"
                id="volume-slider"
                min="0"
                max="1"
                step="0.01"
                value="1"
                title="Volume"
              />
            </div>
            <span id="time-display">0:00 / 0:00</span>
          </div>
          <div class="controls-right">
            <button
              class="control-button"
              id="render-button"
              title="Render a New Scene"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 32 32"
              >
                <path
                  stroke="currentColor"
                  fill="currentColor"
                  d="M8.707 3.293a1 1 0 0 1 0 1.414L5.414 8H17.5C23.299 8 28 12.701 28 18.5S23.299 29 17.5 29S7 24.299 7 18.5a1 1 0 1 1 2 0a8.5 8.5 0 1 0 8.5-8.5H5.414l3.293 3.293a1 1 0 1 1-1.414 1.414l-5-5a1 1 0 0 1 0-1.414l5-5a1 1 0 0 1 1.414 0"
                />
              </svg>
            </button>
            <button
              class="control-button"
              id="pip-button"
              title="Picture In Picture"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 16 16"
              >
                <path
                  stroke="currentColor"
                  fill="currentColor"
                  d="M1 4.5A2.5 2.5 0 0 1 3.5 2h8A2.5 2.5 0 0 1 14 4.5V8h-1V4.5A1.5 1.5 0 0 0 11.5 3h-8A1.5 1.5 0 0 0 2 4.5v5A1.5 1.5 0 0 0 3.5 11H7v1H3.5A2.5 2.5 0 0 1 1 9.5zM9 9a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"
                />
              </svg>
            </button>
            <button class="control-button" id="loop-button" title="Loop (L)">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 24 24"
              >
                <path
                  fill="currentColor"
                  d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6s-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8s-3.6-8-8-8"
                />
              </svg>
            </button>
            <div class="playback-speed-container" style="display: none">
              <button
                class="control-button"
                id="speed-button"
                title="Playback Speed"
              >
                1x
              </button>
              <ul class="speed-options" id="speed-options-list">
                <li data-value="0.5">0.5x</li>
                <li data-value="0.75">0.75x</li>
                <li data-value="1" class="active">1x</li>
                <li data-value="1.5">1.5x</li>
                <li data-value="2">2x</li>
              </ul>
            </div>
            <button
              class="control-button"
              style="display: none"
              id="fullscreen-button"
              title="Fullscreen (F)"
            >
              <svg
                id="fullscreen-enter-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 32 32"
              >
                <path
                  fill="currentColor"
                  d="M4 7a1 1 0 0 1 1-1h6a1 1 0 1 1 0 2H6v5a1 1 0 1 1-2 0zm1-1h5a1 1 0 1 1 0 2H6v5a1 1 0 1 1-2 0zm1 1V5a1 1 0 1 1 2 0v1zM27 6h-6a1 1 0 1 1 0-2h6a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0zm1-1a1 1 0 0 1 1 1v5a1 1 0 1 1-2 0V6h-5a1 1 0 1 1 0-2zm-1 1h-5a1 1 0 1 1 0-2h5zm1 20v-6a1 1 0 1 1 2 0v6a1 1 0 0 1-1 1h-6a1 1 0 1 1 0-2zm-1 1v-5a1 1 0 1 1 2 0v5h-1zm-1-1h6a1 1 0 1 1 0 2h-6a1 1 0 0 1-1-1v-6a1 1 0 1 1 2 0zM5 28a1 1 0 0 1-1-1v-6a1 1 0 1 1 2 0v5h5a1 1 0 1 1 0 2zm-1-1a1 1 0 0 1-1-1v-5a1 1 0 1 1 2 0v5zM6 26v-5a1 1 0 1 1 2 0v5z"
                />
              </svg>
              <svg
                id="fullscreen-exit-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="0 0 32 32"
                style="display: none"
              >
                <path
                  fill="currentColor"
                  d="M10 7a1 1 0 0 0-1 1v5a1 1 0 1 0 2 0V8h5a1 1 0 1 0 0-2zm1-1h5a1 1 0 1 0 0-2H9a1 1 0 0 0-1 1v6a1 1 0 1 0 2 0zm10 1h-5a1 1 0 1 0 0 2h5v5a1 1 0 1 0 2 0V8a1 1 0 0 0-1-1zm1-1v6a1 1 0 1 0 2 0V7a1 1 0 0 0-1-1h-6a1 1 0 1 0 0 2zm-1 1V8a1 1 0 1 0-2 0v1zM11 21H6v-5a1 1 0 1 0-2 0v6a1 1 0 0 0 1 1h6a1 1 0 1 0 0-2zm-1-1H6v-5a1 1 0 1 0-2 0v6a1 1 0 0 0 1 1h5zm11 1h-6a1 1 0 1 0 0 2h6a1 1 0 0 0 1-1v-6a1 1 0 1 0-2 0zm1-1a1 1 0 0 0 1-1v-5a1 1 0 1 0-2 0v5h-5a1 1 0 1 0 0 2zm-1 1h-5a1 1 0 1 0 0 2h5v-1z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
      <!-- ==== END CONTROL BAR ==== -->
    </div>

    <section class="info-section" style="margin-bottom: 20px">
      <div class="module-header">
        <span id="module-name" class="module-name">{{ moduleName }}</span>
      </div>
      <details class="file-details">
        <summary class="details-summary">File Information</summary>
        <div class="details-content">
          <div class="info-line">
            <span class="info-icon">📄</span>
            <!-- Example icon -->
            <span class="info-label">Output:</span>
            <span
              id="output-file"
              class="info-value file-path"
              title="Click to reveal in Explorer"
              >{{ outputFile }}</span
            >
          </div>
          <div class="info-line">
            <span class="info-icon">💻</span>
            <!-- Example icon -->
            <span class="info-label">Source:</span>
            <span
              id="source-file"
              class="info-value file-path"
              title="Click to open file"
              >{{ sourceFile }}</span
            >
          </div>
        </div>
      </details>
    </section>

    <!-- ==== NEW SUPPORT LINKS ==== -->
    <div class="support-links-container" style="margin-top: 20px">
      <a class="support-link-button" href="https://docs.manim.community/"
        >Docs
      </a>
      ·
      <a
        class="support-link-button"
        href="https://github.com/Rickaym/manim-sideview"
      >
        Support
      </a>
      ·
      <a
        class="support-link-button"
        href="https://github.com/Rickaym/manim-sideview/issues/new/choose"
      >
        Issue
      </a>
    </div>
    <!-- ==== END SUPPORT LINKS ==== -->

    <script nonce="{{ nonce }}" src="player.js"></script>
  </body>
</html>
